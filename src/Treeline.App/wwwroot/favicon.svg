  <g fill="#34d399">
    <circle cx="128" cy="150" r="7"/>
    <circle cx="128" cy="112" r="7"/>
  </g>
  <!-- commit nodes: crown -->
  <g fill="#0a1f17">
    <circle cx="128" cy="72" r="15" stroke="#6ee7b7" stroke-width="8"/>
    <circle cx="92" cy="78" r="13" stroke="#6ee7b7" stroke-width="8"/>
    <circle cx="164" cy="78" r="13" stroke="#6ee7b7" stroke-width="8"/>
    <circle cx="76" cy="124" r="13" stroke="#34d399" stroke-width="8"/>
    <circle cx="180" cy="124" r="13" stroke="#34d399" stroke-width="8"/>
