<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Treeline</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 256 256" aria-hidden="true">
        <defs>
          <linearGradient id="brandTrunk" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#0f7a55"/>
            <stop offset="1" stop-color="#34d399"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M128 232 C116 240 110 243 98 246 M128 232 C140 240 146 243 158 246" stroke="#10b981" stroke-width="9"/>
          <path d="M128 236 V150" stroke="url(#brandTrunk)" stroke-width="20"/>
          <path d="M128 152 V74" stroke="#34d399" stroke-width="14"/>
          <path d="M128 150 C112 146 100 134 92 116" stroke="#34d399" stroke-width="14"/>
          <path d="M128 150 C144 146 156 134 164 116" stroke="#34d399" stroke-width="14"/>
          <path d="M92 116 C86 104 80 94 72 84" stroke="#6ee7b7" stroke-width="11"/>
          <path d="M92 116 C98 106 104 96 110 86" stroke="#6ee7b7" stroke-width="11"/>
          <path d="M164 116 C158 106 152 96 146 86" stroke="#6ee7b7" stroke-width="11"/>
          <path d="M164 116 C172 104 178 94 184 84" stroke="#6ee7b7" stroke-width="11"/>
        </g>
        <g fill="var(--bg-elev)">
          <circle cx="128" cy="72" r="15" stroke="#6ee7b7" stroke-width="8"/>
          <circle cx="72" cy="84" r="13" stroke="#6ee7b7" stroke-width="8"/>
          <circle cx="110" cy="86" r="13" stroke="#6ee7b7" stroke-width="8"/>
          <circle cx="146" cy="86" r="13" stroke="#6ee7b7" stroke-width="8"/>
          <circle cx="184" cy="84" r="13" stroke="#6ee7b7" stroke-width="8"/>
          <circle cx="92" cy="116" r="12" stroke="#34d399" stroke-width="8"/>
          <circle cx="164" cy="116" r="12" stroke="#34d399" stroke-width="8"/>
        </g>
        <circle cx="128" cy="150" r="8" fill="#34d399"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Treeline</span>
        <span class="brand-sub" id="gitVersion">connecting…</span>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <span class="updated" id="updated" title="Last update from the server"></span>
      <label class="switch" title="Auto-refresh every 10 seconds">
        <input type="checkbox" id="autoRefresh" checked />
        <span class="switch-track"><span class="switch-thumb"></span></span>
        <span class="switch-label">Auto</span>
      </label>
      <button class="btn btn-ghost" id="themeBtn" title="Toggle theme">◐</button>
      <button class="btn btn-ghost" id="refreshAllBtn" title="Refresh everything now">
        <span class="ico-refresh">↻</span> Refresh
      </button>
      <button class="btn btn-primary" id="addSourceBtn">+ Add source</button>
    </div>
  </header>

  <main id="content" class="content">
    <div class="empty" id="loading">Loading…</div>
  </main>

  <!-- Toasts -->
  <div class="toasts" id="toasts"></div>

  <!-- Generic modal host -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
