<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Treeline</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 256 256" aria-hidden="true">
        <defs>
          <linearGradient id="brandTrunk" gradientUnits="userSpaceOnUse" x1="128" y1="238" x2="128" y2="78">
            <stop offset="0" stop-color="#0f7a55"/>
            <stop offset="1" stop-color="#34d399"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M128 232 C116 240 110 243 98 246 M128 232 C140 240 146 243 158 246" stroke="#10b981" stroke-width="9"/>
          <path d="M128 238 V78" stroke="url(#brandTrunk)" stroke-width="18"/>
          <path d="M128 150 C108 148 92 138 76 124" stroke="#34d399" stroke-width="13"/>
          <path d="M128 150 C148 148 164 138 180 124" stroke="#34d399" stroke-width="13"/>
          <path d="M128 112 C112 108 102 92 92 78" stroke="#6ee7b7" stroke-width="11"/>
          <path d="M128 112 C144 108 154 92 164 78" stroke="#6ee7b7" stroke-width="11"/>
        </g>
        <g fill="#34d399">
          <circle cx="128" cy="150" r="7"/>
          <circle cx="128" cy="112" r="7"/>
        </g>
        <g fill="var(--bg-elev)">
          <circle cx="128" cy="72" r="15" stroke="#6ee7b7" stroke-width="8"/>
          <circle cx="92" cy="78" r="13" stroke="#6ee7b7" stroke-width="8"/>
          <circle cx="164" cy="78" r="13" stroke="#6ee7b7" stroke-width="8"/>
          <circle cx="76" cy="124" r="13" stroke="#34d399" stroke-width="8"/>
          <circle cx="180" cy="124" r="13" stroke="#34d399" stroke-width="8"/>
        </g>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Treeline</span>
        <span class="brand-sub" id="gitVersion">connecting…</span>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <span class="updated" id="updated" title="Last update from the server"></span>
      <label class="switch" title="Auto-refresh every 10 seconds">
        <input type="checkbox" id="autoRefresh" checked />
        <span class="switch-track"><span class="switch-thumb"></span></span>
        <span class="switch-label">Auto</span>
      </label>
      <button class="btn btn-ghost" id="themeBtn" title="Toggle theme">◐</button>
      <button class="btn btn-ghost" id="refreshAllBtn" title="Refresh everything now">
        <span class="ico-refresh">↻</span> Refresh
      </button>
      <button class="btn btn-primary" id="addSourceBtn">+ Add source</button>
    </div>
  </header>

  <main id="content" class="content">
    <div class="empty" id="loading">Loading…</div>
  </main>

  <!-- Toasts -->
  <div class="toasts" id="toasts"></div>

  <!-- Generic modal host -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
