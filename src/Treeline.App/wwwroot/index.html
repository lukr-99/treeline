<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Treeline</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 256 256" aria-hidden="true">
        <defs>
          <linearGradient id="brandTrunk" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#0f7a55"/>
            <stop offset="1" stop-color="#34d399"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M128 214 C118 224 112 228 100 231 M128 214 C138 224 144 228 156 231" stroke="#0f7a55" stroke-width="9"/>
          <path d="M128 216 V52" stroke="url(#brandTrunk)" stroke-width="18"/>
          <path d="M128 152 C104 152 92 130 74 120" stroke="#34d399" stroke-width="13"/>
          <path d="M128 152 C152 152 164 130 182 120" stroke="#34d399" stroke-width="13"/>
          <path d="M128 98 C108 98 100 74 86 60" stroke="#6ee7b7" stroke-width="12"/>
          <path d="M128 98 C148 98 156 74 170 60" stroke="#6ee7b7" stroke-width="12"/>
        </g>
        <g fill="var(--bg-elev)">
          <circle cx="128" cy="52" r="16" stroke="#6ee7b7" stroke-width="8"/>
          <circle cx="86" cy="60" r="14" stroke="#6ee7b7" stroke-width="8"/>
          <circle cx="170" cy="60" r="14" stroke="#6ee7b7" stroke-width="8"/>
          <circle cx="74" cy="120" r="14" stroke="#34d399" stroke-width="8"/>
          <circle cx="182" cy="120" r="14" stroke="#34d399" stroke-width="8"/>
        </g>
        <g fill="#34d399">
          <circle cx="128" cy="152" r="7"/>
          <circle cx="128" cy="98" r="7"/>
        </g>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Treeline</span>
        <span class="brand-sub" id="gitVersion">connecting…</span>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <span class="updated" id="updated" title="Last update from the server"></span>
      <label class="switch" title="Auto-refresh every 10 seconds">
        <input type="checkbox" id="autoRefresh" checked />
        <span class="switch-track"><span class="switch-thumb"></span></span>
        <span class="switch-label">Auto</span>
      </label>
      <button class="btn btn-ghost" id="themeBtn" title="Toggle theme">◐</button>
      <button class="btn btn-ghost" id="refreshAllBtn" title="Refresh everything now">
        <span class="ico-refresh">↻</span> Refresh
      </button>
      <button class="btn btn-primary" id="addSourceBtn">+ Add source</button>
    </div>
  </header>

  <main id="content" class="content">
    <div class="empty" id="loading">Loading…</div>
  </main>

  <!-- Toasts -->
  <div class="toasts" id="toasts"></div>

  <!-- Generic modal host -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
